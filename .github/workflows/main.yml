name: Build & Release APK

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Explicit release tag (default: v<versionName> from build.gradle.kts)'
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: build-and-release
  cancel-in-progress: false

jobs:
  build-release:
    name: Build APK and publish release
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Accept Android SDK licenses
        run: |
          yes | "$ANDROID_SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager --licenses >/dev/null 2>&1 || true

      - name: Preinstall NDK / CMake (best-effort)
        run: |
          "$ANDROID_SDK_ROOT"/cmdline-tools/latest/bin/sdkmanager --install "ndk;27.1.12297006" "cmake;3.22.1" >/dev/null 2>&1 || echo "sdkmanager install skipped; relying on AGP auto-download"

      - name: Verify release signing keystore (persistent in repo)
        run: |
          set -euo pipefail
          test -f app/signing/release.jks || { echo "Keystore missing"; exit 1; }
          keytool -list -keystore app/signing/release.jks -storepass rootmygalaxy | grep -q "s918nrelease" || { echo "Keystore alias missing"; exit 1; }
          echo "Signing keystore present and intact."

      - name: Resolve release tag
        id: tag
        shell: bash
        run: |
          set -euo pipefail
          if [ "${GITHUB_REF_TYPE:-}" = "tag" ]; then
            TAG_NAME="${GITHUB_REF_NAME}"
          else
            VERSION_NAME="$(grep -oE 'versionName[[:space:]]*=[[:space:]]*"[^"]+"' app/build.gradle.kts | head -n 1 | cut -d'"' -f2)"
            TAG_NAME="${INPUT_TAG_NAME:-v${VERSION_NAME}}"
          fi
          if [ -z "$TAG_NAME" ]; then
            echo "No release tag resolved." >&2
            exit 1
          fi
          echo "tag_name=$TAG_NAME" >> "$GITHUB_OUTPUT"
          echo "Resolved release tag: $TAG_NAME"
        env:
          INPUT_TAG_NAME: ${{ inputs.tag_name }}

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Build debug and release APKs
        run: ./gradlew :app:assembleDebug :app:assembleRelease --no-daemon --stacktrace

      - name: Upload pipeline artifacts (downloadable from Actions)
        uses: actions/upload-artifact@v4
        with:
          name: RootMyGalaxy-apks
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Create and push explicit git tag BEFORE release publish
        shell: bash
        env:
          TAG_NAME: ${{ steps.tag.outputs.tag_name }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if ! git rev-parse -q --verify "refs/tags/$TAG_NAME" >/dev/null 2>&1; then
            git tag -a "$TAG_NAME" -m "Release $TAG_NAME"
            git push origin "refs/tags/$TAG_NAME"
            echo "Created and pushed tag $TAG_NAME."
          else
            echo "Tag $TAG_NAME already exists on origin."
            git push origin "refs/tags/$TAG_NAME" || true
          fi

      - name: Publish GitHub Release (explicit tag, gh CLI)
        shell: bash
        env:
          TAG_NAME: ${{ steps.tag.outputs.tag_name }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/apks
          cp app/build/outputs/apk/debug/*.apk /tmp/apks/
          cp app/build/outputs/apk/release/*.apk /tmp/apks/
          ls -la /tmp/apks/

          PREVIOUS_TAG="$(git tag --list 'v*' --sort=-v:refname | grep -Fxv "$TAG_NAME" | head -n 1 || true)"
          {
            echo "# Release $TAG_NAME"
            echo
            echo "Version: ${TAG_NAME#v}"
            echo "Commit: $(git rev-parse HEAD)"
            echo
            if [ -n "$PREVIOUS_TAG" ]; then
              echo "Changes since $PREVIOUS_TAG:"
              echo
              git log --format='- %s' "$PREVIOUS_TAG..$TAG_NAME" || true
            else
              echo "First tagged release."
            fi
          } > /tmp/release-notes.md

          if gh release view "$TAG_NAME" >/dev/null 2>&1; then
            echo "Release $TAG_NAME already exists; updating assets."
            gh release upload "$TAG_NAME" /tmp/apks/* --clobber
            gh release edit "$TAG_NAME" --notes-file /tmp/release-notes.md --latest
          else
            echo "Creating explicit release $TAG_NAME."
            gh release create "$TAG_NAME" /tmp/apks/* \
              --title "Release $TAG_NAME" \
              --notes-file /tmp/release-notes.md \
              --latest
          fi
